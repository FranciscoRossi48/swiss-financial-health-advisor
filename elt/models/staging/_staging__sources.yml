version: 2

sources:
  - name: swiss_financial_health
    database: swiss-fin-health-tfg
    schema: swiss_financial_health
    tables:
      - name: raw_transactions
        description: >
          Synthetic Open Banking-style transactions, generated by
          swiss_financial_health.data_generation (see the repo's main README) and
          loaded as-is from Cloud Storage into BigQuery — no transformation applied yet.
        columns:
          - name: user_id
            description: Synthetic user identifier (e.g. U0001).
          - name: date
            description: Transaction date.
          - name: category
            description: Transaction category (e.g. salary, rent, groceries, debt_payment).
          - name: transaction_type
            description: One of income, expense, savings.
          - name: amount_chf
            description: Transaction amount in Swiss francs. Always non-negative.
          - name: profile
            description: Synthetic behavioral profile used to generate this user's data.
