[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-financial-health-advisor"
version = "0.1.0"
description = "Prescriptive analytics prototype for personal financial health in a Swiss neobank context."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.1",
  "numpy>=1.26,<2.6",
  "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.58,<1.60",
  "starlette<1.4",  # pin: streamlit's transitive ASGI dependency, avoids breaking changes in 1.4+
  "plotly>=5.22,<7.0",
]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]
dev = [
  "pytest>=8.2,<10.0",
  "ruff>=0.7,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "app"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# these entry-point scripts must extend sys.path before importing the local package
"app/streamlit_app.py" = ["E402", "I001"]
"app/api.py" = ["E402", "I001"]
"scripts/build_demo_data.py" = ["E402"]
